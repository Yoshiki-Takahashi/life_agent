name: Backend Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Check Core API
        working-directory: backend/services/core-api
        run: |
          uv run --frozen ruff check .
          uv run --frozen pytest

      - name: Check Goal Planner
        working-directory: backend/services/goal-planner
        run: |
          uv run --frozen ruff check .
          uv run --frozen pytest -m "not live_ai"

      - name: Build backend container images
        run: |
          docker build --tag lifeagent-core-api:ci backend/services/core-api
          docker build --tag lifeagent-goal-planner:ci backend/services/goal-planner

      - name: Run service integration test
        run: ./scripts/test-weekend-3.sh

      - name: Run progress concurrency test
        run: ./scripts/test-weekend-7.sh
