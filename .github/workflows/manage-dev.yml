name: Manage Development Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation to run
        required: true
        default: status
        type: choice
        options:
          - status
          - start
          - stop

permissions:
  contents: read
  id-token: write

concurrency:
  group: manage-dev
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      CORE_API_SERVICE: ${{ vars.CORE_API_SERVICE }}
      GOAL_PLANNER_SERVICE: ${{ vars.GOAL_PLANNER_SERVICE }}

    steps:
      - name: Validate settings
        run: |
          : "${PROJECT_ID:?GCP_PROJECT_ID variable is required}"
          : "${REGION:?GCP_REGION variable is required}"
          : "${WIF_PROVIDER:?GCP_WORKLOAD_IDENTITY_PROVIDER variable is required}"
          : "${DEPLOYER_SERVICE_ACCOUNT:?GCP_DEPLOYER_SERVICE_ACCOUNT variable is required}"
          : "${CORE_API_SERVICE:?CORE_API_SERVICE variable is required}"
          : "${GOAL_PLANNER_SERVICE:?GOAL_PLANNER_SERVICE variable is required}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Manage Cloud Run
        if: ${{ inputs.action != 'status' }}
        env:
          ACTION: ${{ inputs.action }}
        run: ./scripts/gcp/"${ACTION}"-dev.sh

      - name: Verify state
        run: ./scripts/gcp/status-dev.sh
