[project]
name = "lifeagent-goal-planner"
version = "0.1.0"
description = "LifeAgent Goal Planner Service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.24.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_agent_goal_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_ai: calls the real OpenAI API and requires OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
