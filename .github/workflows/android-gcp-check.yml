name: Android GCP Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-gcp-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests, build and lint (no cloud credentials)
        working-directory: android
        run: ./gradlew -Plifeagent.useCloudFirebase=false testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug

  cloud:
    # Fork PRs cannot enter this job. An environment approval protects the WIF credential boundary.
    if: >-
      vars.ANDROID_GCP_CHECK_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: android-gcp-check
    needs: android
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ANDROID_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Write public Firebase SDK configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.ANDROID_FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ vars.ANDROID_FIREBASE_APPLICATION_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          keys = ('FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_APPLICATION_ID')
          assert all(os.environ.get(k) and '\n' not in os.environ[k] for k in keys)
          Path('android/config/auth-cloud-debug.properties').write_text(
              ''.join(f'{k}={os.environ[k]}\n' for k in keys))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build cloud Android
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Plifeagent.useCloudFirebase=true
      - name: Dedicated ephemeral Android to deployed GCP
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHECK_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CHECK_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CHECK_SECRET: ${{ vars.ANDROID_GCP_CREDENTIALS_SECRET }}
        with:
          api-level: 35
          arch: x86_64
          avd-name: LifeAgent_GCP_Check
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            uv run --project backend/services/core-api python scripts/gcp/check-account-android.py --project "$CHECK_PROJECT" --secret "${CHECK_SECRET:-lifeagent-gcp-check-credentials}" --sha "$(git rev-parse HEAD)" --pr-head-sha "${CHECK_PR_HEAD:-not-applicable}"
      - name: Remove local SDK configuration
        if: always()
        run: rm -f android/config/auth-cloud-debug.properties
      # Do not upload device logs, screenshots, test reports, snapshots or credentials.
