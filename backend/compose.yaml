services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifeagent}
      POSTGRES_USER: ${POSTGRES_USER:-lifeagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeagent_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeagent} -d ${POSTGRES_DB:-lifeagent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  goal-planner:
    profiles: ["ai"]
    build:
      context: services/goal-planner
    environment:
      GOAL_PLANNER_PROVIDER: ${GOAL_PLANNER_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
    ports:
      - "8001:8001"

volumes:
  postgres-data:
