[project]
name = "lifeagent-core-api"
version = "0.1.0"
description = "LifeAgent Core API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "firebase-admin>=7.1.0",
    "google-auth>=2.58.0",
    "google-cloud-firestore>=2.30.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
