services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lifeagent
      POSTGRES_USER: lifeagent
      POSTGRES_PASSWORD: lifeagent_e2e
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeagent -d lifeagent"]
      interval: 1s
      timeout: 3s
      retries: 10
