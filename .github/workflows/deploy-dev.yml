name: Deploy Development Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Finish a cutover or its rollback; a newer merge must not cancel it halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: development
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      CORE_API_SERVICE: ${{ vars.CORE_API_SERVICE }}
      CORE_API_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CORE_API_RUNTIME_SERVICE_ACCOUNT }}
      GOAL_PLANNER_SERVICE: ${{ vars.GOAL_PLANNER_SERVICE }}
      GOAL_PLANNER_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GOAL_PLANNER_RUNTIME_SERVICE_ACCOUNT }}
      OPENAI_SECRET_NAME: ${{ vars.OPENAI_SECRET_NAME }}
      # Keep deployment policy out of the application settings used by tests.
      CORE_API_ALLOWED_USER_ID: ${{ vars.CORE_API_ALLOWED_USER_ID }}
      CORE_API_ALLOWED_USER_IDS: ${{ vars.CORE_API_ALLOWED_USER_IDS }}
      CORE_API_FEEDBACK_GITHUB_REPOSITORY: ${{ vars.FEEDBACK_GITHUB_REPOSITORY }}
      FEEDBACK_GITHUB_SECRET_NAME: ${{ vars.FEEDBACK_GITHUB_SECRET_NAME }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firestore Emulator
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator

      - name: Check Core API and deployment boundaries
        working-directory: backend/services/core-api
        run: |
          uv run --frozen ruff check --config pyproject.toml . ../../../scripts/gcp/deploy-dev.py ../../../scripts/check-deployment.py ../../../tests/deployment
          uv run --frozen pytest tests ../../../tests/deployment

      - name: Check Goal Planner
        working-directory: backend/services/goal-planner
        run: |
          uv run --frozen ruff check .
          uv run --frozen pytest -m 'not live_ai'

      - name: Check service integration and concurrent saves
        run: |
          ./scripts/test-weekend-3.sh
          ./scripts/test-weekend-7.sh

      - name: Validate deployment settings
        run: |
          for setting in PROJECT_ID REGION REPOSITORY WIF_PROVIDER DEPLOYER_SERVICE_ACCOUNT CORE_API_SERVICE CORE_API_RUNTIME_SERVICE_ACCOUNT GOAL_PLANNER_SERVICE GOAL_PLANNER_RUNTIME_SERVICE_ACCOUNT OPENAI_SECRET_NAME CORE_API_ALLOWED_USER_ID; do
            test -n "${!setting}" || { echo "Missing setting: $setting"; exit 1; }
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the two immutable images
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          for service in core-api goal-planner; do
            image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/lifeagent-${service}:${GITHUB_SHA}"
            docker build --tag "$image" "backend/services/$service"
            docker push "$image"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            if [[ "$service" == core-api ]]; then setting=CORE_API_IMAGE; else setting=GOAL_PLANNER_IMAGE; fi
            printf '%s=%s\n' "$setting" "$digest" >> "$GITHUB_ENV"
          done

      - name: Verify Firestore settings and indexes
        run: ./scripts/gcp/check-firestore.sh

      - name: Verify candidates and switch traffic
        env:
          ALLOWED_USER_ID: ${{ env.CORE_API_ALLOWED_USER_ID }}
          ALLOWED_USER_IDS: ${{ env.CORE_API_ALLOWED_USER_IDS }}
          FEEDBACK_GITHUB_REPOSITORY: ${{ env.CORE_API_FEEDBACK_GITHUB_REPOSITORY }}
        run: uv run --project backend/services/core-api python scripts/gcp/deploy-dev.py

      - name: Save deployment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: ignore
