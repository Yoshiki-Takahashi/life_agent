name: Android Quality

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  calendar-screenshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lifeagent-calendar-themes
          run-id: '44643213602'
          github-token: ${{ github.token }}
      - name: Export the synthetic calendar screenshot for review
        env:
          CALENDAR_THEME: ${{ matrix.theme }}
        run: |
          artifact_file="issue68-calendar-${CALENDAR_THEME}.png"
          sha256sum "$artifact_file"
          base64 -w 720 "$artifact_file" | sed 's/^/LIFEAGENT_CALENDAR_PNG /'
